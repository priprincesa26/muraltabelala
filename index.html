<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mural TabeLaLa</title>
    <!-- Fontes Premium: Playfair Display (Título) e Montserrat (Subtítulo) -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,700&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505; /* Preto quase absoluto */
            --overlay-opacity: 0.35; /* Transparência ideal para ver as tabelas */
            --text-color: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        /* CAMADA ESCURA SOBRE O SITE TODO */
        .dark-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, var(--overlay-opacity));
            z-index: 10;
            pointer-events: none;
        }

        /* TEXTOS FIXOS NO CENTRO */
        .hero-center {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
            text-align: center;
            width: 90%;
            pointer-events: none;
        }

        .hero-center h1 {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 8vw;
            color: var(--text-color);
            letter-spacing: -2px;
            line-height: 1;
            text-shadow: 0 10px 40px rgba(0,0,0,0.6);
            margin-bottom: 10px;
        }

        .hero-center p {
            font-family: 'Montserrat', sans-serif;
            color: var(--text-color);
            font-size: 1.2vw;
            font-weight: 300;
            text-transform: uppercase;
            letter-spacing: 8px;
            opacity: 0.8;
        }

        /* EFEITO ESFUMAÇADO NO FINAL */
        .bottom-gradient {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40vh;
            background: linear-gradient(to top, var(--bg-color) 0%, transparent 100%);
            z-index: 20;
            pointer-events: none;
        }

        /* CONTAINER MASONRY */
        .masonry-mural {
            padding: 5px;
            column-count: 4;
            column-gap: 5px;
            width: 100%;
            position: relative;
            z-index: 5;
        }

        .masonry-item {
            display: inline-block;
            width: 100%;
            margin-bottom: 5px;
            break-inside: avoid;
            transition: transform 0.4s ease;
        }

        .masonry-item img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 2px;
            filter: grayscale(20%);
            transition: all 0.4s ease;
            background-color: #111; /* Cor de fundo enquanto carrega */
        }

        .masonry-item:hover {
            transform: scale(1.02);
            z-index: 30;
        }

        .masonry-item:hover img {
            filter: grayscale(0%) brightness(1.1);
        }

        /* RESPONSIVIDADE */
        @media (max-width: 1200px) {
            .masonry-mural { column-count: 3; }
            .hero-center h1 { font-size: 10vw; }
            .hero-center p { font-size: 2vw; }
        }

        @media (max-width: 800px) {
            .masonry-mural { column-count: 2; }
            .hero-center h1 { font-size: 14vw; }
            .hero-center p { font-size: 3vw; letter-spacing: 4px; }
            .bottom-gradient { height: 25vh; }
        }

        @media (max-width: 500px) {
            .masonry-mural { column-count: 1; }
        }
    </style>
</head>
<body>

    <div class="dark-overlay"></div>

    <div class="hero-center">
        <h1>Mural TabeLaLa</h1>
        <p>Tabelas e depoimentos de usuários</p>
    </div>

    <div class="masonry-mural" id="gallery">
        <!-- As imagens entrarão aqui automaticamente via JS -->
    </div>

    <div class="bottom-gradient"></div>

    <script>
        // --- CONFIGURAÇÃO DO SEU GITHUB ---
        const GITHUB_USER = "SEU_USUARIO_AQUI";      // Nome do seu perfil no GitHub
        const GITHUB_REPO = "SEU_REPOSITORIO_AQUI"; // Nome do repositório (projeto)
        const GITHUB_PATH = "";                     // Nome da pasta onde estão as fotos (deixe vazio se estiverem na raiz)

        const gallery = document.getElementById('gallery');

        async function fetchImages() {
            try {
                // URL da API do GitHub para listar arquivos
                const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${GITHUB_PATH}`;
                
                const response = await fetch(url);
                const files = await response.json();

                if (!Array.isArray(files)) {
                    console.error("Erro: Não foi possível listar os arquivos. Verifique as configurações.");
                    return;
                }

                // Extensões que o código vai aceitar
                const validExtensions = ['.png', '.jpg', '.jpeg', '.jfif', '.webp', '.gif'];

                // Filtra apenas as imagens e remove arquivos como index.html ou README
                const images = files.filter(file => {
                    const fileName = file.name.toLowerCase();
                    return validExtensions.some(ext => fileName.endsWith(ext));
                });

                // Inverter a ordem para que as fotos mais recentes (subidas por último) apareçam primeiro
                images.reverse();

                images.forEach(image => {
                    const item = document.createElement('div');
                    item.className = 'masonry-item';
                    
                    const img = document.createElement('img');
                    img.src = image.download_url; // Link direto da imagem no GitHub
                    img.alt = "Tabela TabeLaLa";
                    img.loading = "lazy"; // Melhora a velocidade do site
                    
                    item.appendChild(img);
                    gallery.appendChild(item);
                });

            } catch (error) {
                console.error("Erro ao carregar a galeria:", error);
            }
        }

        // Inicia a função
        fetchImages();
    </script>
</body>
</html>
